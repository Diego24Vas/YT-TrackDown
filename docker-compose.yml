services:
  ytdown:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ytdown_app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=${PORT:-8080}
      - HOST=${HOST:-0.0.0.0}
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-2}
      - DEFAULT_AUDIO_QUALITY=${DEFAULT_AUDIO_QUALITY:-192}
      - FILE_RETENTION_MINUTES=${FILE_RETENTION_MINUTES:-15}
      - CLEANUP_CHECK_INTERVAL_SECONDS=${CLEANUP_CHECK_INTERVAL_SECONDS:-30}
      - COOKIES_FILE=${COOKIES_FILE:-/app/cookies/cookies.txt}
    volumes:
      - ./downloads:/app/downloads:z
      - ./cookies:/app/cookies:z
      - ./frontend:/app/frontend:ro,z
